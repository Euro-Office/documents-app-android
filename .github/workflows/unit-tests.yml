# Runs the app's unit tests (core, appmanager) on the JVM and checks how much of a PR's changed
# lines they cover. appmanager builds only with the editors (libsnapshot comes with them), so
# editors-android is checked out next to this repository, as in MobileEditors. Without
# -PwithNativeCore their engine is a stub: no core and no NDK are needed.
#
# The screens (ui/) are left out of the coverage check: unit tests can't reach them,
# MobileEditors' UI tests run the app on an emulator. Modules without tests (libtoolkit,
# libcompose, core:network, ...) write no coverage report, so their changes are not checked.

name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # editors-android branch the app builds with
  EDITORS_ANDROID_REF: main

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out editors-android
        run: git clone --quiet --depth 1 --branch "$EDITORS_ANDROID_REF" https://github.com/Euro-Office/editors-android.git ../editors-android

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test
        working-directory: app_manager
        run: ./gradlew --no-daemon :core:createDebugUnitTestCoverageReport :appmanager:createDebugUnitTestCoverageReport

      - name: Coverage of the changed lines
        if: github.event_name == 'pull_request'
        uses: Euro-Office/.github/actions/diff-coverage@c6be61e1c3cc63761a8a70c71fad268bf9ee434e # main
        with:
          reports: app_manager/core/build/reports/coverage/test/debug/report.xml app_manager/appmanager/build/reports/coverage/test/debug/report.xml
          fail-under: 80
          args: --src-roots app_manager/core/src/main/java app_manager/appmanager/src/main/java --exclude '*/ui/*'

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            app_manager/core/build/reports
            app_manager/appmanager/build/reports
          if-no-files-found: ignore
